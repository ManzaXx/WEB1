<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 11 · Validación simple de email · Tema 1</title>
  <link rel="stylesheet" href="../estilos.css">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Ejercicio 11 · Validación simple de email</h1>
    <p class="enunciado">Con cada tecla (evento <code>input</code>) se comprueba si el texto tiene una <code>@</code> y un punto.</p>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="email" spellcheck="false" aria-describedby="estado">
    <p><span id="estado" class="estado" aria-live="polite">Escribe tu email</span></p>
  </main>
</body>
</html>
