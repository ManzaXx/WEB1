<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 10 · DOM: contador interactivo · Tema 1</title>
  <link rel="stylesheet" href="../estilos.css">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Ejercicio 10 · Contador interactivo</h1>
    <p class="enunciado">Un número y dos botones que lo incrementan y decrementan.</p>
    <div class="contador">
      <button type="button" id="menos" aria-label="Restar uno">−</button>
      <output id="valor" aria-live="polite">0</output>
      <button type="button" id="mas" aria-label="Sumar uno">+</button>
    </div>
  </main>
</body>
</html>
