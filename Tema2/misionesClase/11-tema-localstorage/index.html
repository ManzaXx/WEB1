<body>
  <main>
    <h1>Ejercicio 11 · Tema claro u oscuro</h1>
    <p class="enunciado">El botón alterna la clase <code>oscuro</code> del <code>&lt;body&gt;</code> y guarda la preferencia en <code>localStorage</code>; al recargar se aplica sola.</p>
    <button type="button" id="cambiar-tema" aria-pressed="false">Activar tema oscuro</button>
    <p class="nota">Valor guardado: <code id="valor-guardado">(ninguno)</code>. Se puede ver en F12 → Application → Local Storage, clave <code>tema</code>.</p>
